<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#007BFF" />
    </linearGradient>
    <style>
      .text-main { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #0A2540; }
      .text-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#aiGradient); }
      .text-micro { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #6B7280; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Sembol Grubu -->
  <g transform="translate(30, 25)">
    <!-- Kontrat / Belge İkonu -->
    <rect x="10" y="10" width="80" height="110" rx="8" fill="none" stroke="#0A2540" stroke-width="8"/>
    <line x1="30" y1="40" x2="70" y2="40" stroke="#0A2540" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="80" y2="65" stroke="#0A2540" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="90" x2="55" y2="90" stroke="#0A2540" stroke-width="6" stroke-linecap="round"/>

    <!-- Analiz / Yapay Zeka Büyüteci -->
    <circle cx="95" cy="105" r="35" fill="#ffffff" stroke="url(#aiGradient)" stroke-width="8"/>
    
    <!-- Yapay Zeka 'Spark' Yıldızı (Merkez) -->
    <path d="M95 87 L98 99 L110 102 L98 105 L95 117 L92 105 L80 102 L92 99 Z" fill="#0A2540"/>
    
    <!-- Büyüteç Sapı -->
    <line x1="120" y1="130" x2="145" y2="155" stroke="url(#aiGradient)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Metin Grubu -->
  <g transform="translate(200, 85)">
    <text class="text-main" x="0" y="0">Linktera</text>
    <text class="text-sub" x="0" y="55">Contract AI</text>
    <text class="text-micro" x="3" y="90">POWERED BY LINKTERA ROBOTICS</text>
  </g>
</svg>
